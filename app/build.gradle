plugins {
    id 'com.android.application'
}

// Settings come from cosy.defaults.properties, overlaid by your own cosy.properties when it exists,
// and reach the app as string resources (R.string.dock and so on). A second TV that wants its own
// dock gets a file of just the keys that differ, named on the command line:
//   ./gradlew assembleRelease -Pcosy=cosy.lg.properties
def settings = new Properties()
def files = ['cosy.defaults.properties', 'cosy.properties']
if (project.hasProperty('cosy')) files += project.property('cosy').toString()
files.each { name ->
    def f = rootProject.file(name)
    if (f.exists()) f.withReader('UTF-8') { settings.load(it) }
}
// resValue escapes XML itself, but not the characters Android's string parser treats specially.
def resString = { String s ->
    s.trim().replace('\\', '\\\\').replace("'", "\\'").replace('"', '\\"')
}

// Release signing: a keystore.properties next to settings.gradle (storeFile, storePassword,
// keyAlias, keyPassword) signs with your own key. Without one the debug key is used, which is fine
// for installing on your own TV.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withReader('UTF-8') { keystoreProps.load(it) }

android {
    namespace 'com.cosyhome.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cosyhome.tv'
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ['location.name', 'location.latitude', 'location.longitude', 'dock', 'pinned', 'hidden',
         'live_tv_package', 'usb_package', 'ambilight_action'].each { key ->
            resValue 'string', key.replace('.', '_'), resString(settings.getProperty(key, ''))
        }
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
